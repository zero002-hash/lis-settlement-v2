<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 배차계획 로딩</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--text:#2E3238;--sub1:#5C6370;--sub2:#767D8A;--sub3:#9197A1;--line:#E4E5E9;--bg:#F6F7F8;--blue:#005FFF;--font:"Pretendard",-apple-system,sans-serif;
    --blk-bg:#F3EFFF;--blk-line:#B9A6F5;--blk-text:#5A2FC7;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:#5C6068;font-family:var(--font);color:var(--text);letter-spacing:-0.3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px;}
  button{font-family:var(--font);letter-spacing:inherit;}

  /* 데모 컨트롤 (프로토타입 전용) */
  .demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#fff;font-size:13px;}
  .demo button{height:32px;padding:0 12px;border:1px solid rgba(255,255,255,.35);border-radius:4px;background:rgba(255,255,255,.08);color:#fff;font-size:13px;cursor:pointer;}
  .demo label{display:flex;align-items:center;gap:6px;cursor:pointer;}

  .modal{width:960px;max-width:100%;height:600px;max-height:calc(100vh - 100px);background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;}
  .head{display:flex;align-items:center;gap:16px;height:66px;padding:0 24px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .head h1{margin:0;font-size:20px;font-weight:700;}
  .head .day{font-size:16px;color:var(--sub1);}
  .head .day b{margin-left:6px;font-weight:600;color:var(--text);}
  .head .x{margin-left:auto;width:32px;height:32px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  .body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--bg);padding:24px;}

  /* C: 간트 채우기 */
  .gantt{width:640px;max-width:100%;padding:16px 16px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .axis{display:flex;margin-left:64px;margin-bottom:6px;font-size:11px;color:var(--sub3);}
  .axis span{flex:1;}
  .g-row{display:flex;align-items:center;height:34px;}
  .g-row + .g-row{border-top:1px solid #F1F2F4;}
  .g-name{width:64px;flex-shrink:0;display:flex;align-items:center;gap:6px;}
  .g-name i{display:block;width:40px;height:8px;border-radius:4px;background:#E9EBEE;}
  .g-track{position:relative;flex:1;height:100%;}
  .blk{position:absolute;top:6px;height:22px;border:1.5px dashed #C7CBD1;border-radius:5px;background:transparent;
    transition:left .7s cubic-bezier(.3,.7,.2,1),width .7s cubic-bezier(.3,.7,.2,1),opacity .3s,background-color .35s,border-color .35s;}
  .blk.in{opacity:1;}
  .blk.lock{border-style:solid;border-color:var(--blk-line);background:var(--blk-bg);}
  .blk.lock::before{content:attr(data-n);position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--blk-text);}
  .blk.lock::after{content:"";position:absolute;left:18px;right:8px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:#DDD3FB;}
  .blk.pop{animation:pop .35s ease-out;}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.06);}100%{transform:scale(1);}}
  .gantt.fade .blk{opacity:0;transition:opacity .35s;}

  /* A: 단계 안내 한 줄 */
  .status{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .status h2{margin:0;font-size:20px;font-weight:700;}
  .step{display:flex;align-items:center;gap:8px;height:24px;font-size:15px;color:var(--sub1);}
  .step .txt{transition:opacity .25s,transform .25s;}
  .step .txt.out{opacity:0;transform:translateY(-6px);}
  .step .cnt{font-size:13px;color:var(--sub3);font-variant-numeric:tabular-nums;}
  .spin{width:14px;height:14px;border:2px solid #CCDFFF;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .dots{display:flex;gap:6px;}
  .dots i{width:24px;height:4px;border-radius:2px;background:#E4E5E9;transition:background .3s;}
  .dots i.on{background:var(--blue);}
  .hint{margin:0;font-size:13px;color:var(--sub3);}
  .back{border:none;background:none;padding:0;font-size:13px;color:var(--sub1);text-decoration:underline;text-underline-offset:3px;cursor:pointer;}

  .done .spin{display:none;}
  .ok{display:none;width:16px;height:16px;border-radius:50%;background:var(--blue);position:relative;}
  .ok::after{content:"";position:absolute;left:5px;top:3px;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .done .ok{display:block;}

  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,8px);padding:12px 24px;border-radius:8px;background:#2E3238;color:#fff;font-size:15px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* 동작 줄이기: 움직임 없이 완성된 간트 + 단계 문구만 */
  .reduce .blk{transition:none;}
  .reduce .blk.pop{animation:none;}
  .reduce .spin{animation:none;border-color:var(--blue);}
</style>
</head>
<body>
<div class="demo" aria-label="데모 조작">
  <span>프로토타입 조작:</span>
  <button id="replay">처음부터 다시</button>
  <label><input type="checkbox" id="reduce">동작 줄이기(접근성) 보기</label>
</div>

<div class="modal" id="modal" role="dialog" aria-label="AI 배차계획 진행 중">
  <div class="head">
    <h1>AI 배차계획</h1>
    <span class="day">배차일지<b>10.11 (내일)</b></span>
    <button class="x" aria-label="닫기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#767D8A" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="body">
    <div class="gantt" id="gantt" aria-hidden="true">
      <div class="axis"><span>00</span><span>04</span><span>08</span><span>12</span><span>16</span><span>20</span></div>
      <div id="rows"></div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">
      <h2 id="title">AI가 배차계획을 만들고 있어요</h2>
      <div class="step"><span class="spin"></span><span class="ok"></span><span class="txt" id="stepTxt"></span><span class="cnt" id="stepCnt"></span></div>
      <div class="dots" id="dots"></div>
      <p class="hint" id="hint">보통 30초 정도 걸려요</p>
      <button class="back" id="back">기다리지 않고 배차일지로 돌아가기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const STEPS = ["오더 800건 확인 중", "기사 90명 차고지·운영시간 확인 중", "이동 경로 계산 중", "최적 배차 조합 찾는 중", "결과 정리 중"];
  const STEP_MS = 2600;           // 단계 하나 길이 (데모용)
  const ROWS = 6, HOURS = 24;
  let timers = [], reduce = false;

  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  function clearAll(){ timers.forEach(clearTimeout); timers = []; }
  const rand = (a, b) => a + Math.random() * (b - a);

  // 기사 한 줄에 2~3개 블럭, 겹치지 않게 배치 (단위: 시간)
  function layout(){
    return Array.from({length:ROWS}, function(){
      const n = Math.random() < .5 ? 2 : 3, out = [];
      let t = rand(0.5, 3);
      for(let i = 0; i < n; i++){
        const len = rand(3, 5.5);
        if(t + len > HOURS - .5) break;
        out.push({s:t, len:len});
        t += len + rand(1, 3);
      }
      return out;
    });
  }
  const pct = h => (h / HOURS * 100) + "%";

  function buildRows(){
    $("rows").innerHTML = Array.from({length:ROWS}, () => '<div class="g-row"><div class="g-name"><i></i></div><div class="g-track"></div></div>').join("");
  }

  // 한 판: 빈 블럭이 엉뚱한 자리에 나타나 → 제자리로 이동 → 색이 채워짐
  function playRound(delay){
    const plan = layout(), tracks = document.querySelectorAll(".g-track");
    $("gantt").classList.remove("fade");
    tracks.forEach(t => t.innerHTML = "");
    let k = 0;
    plan.forEach(function(blocks, r){
      blocks.forEach(function(b, i){
        const el = document.createElement("div");
        el.className = "blk"; el.dataset.n = i + 1; el.dataset.s = b.s; el.dataset.len = b.len;
        el.style.opacity = 0;
        el.style.left = pct(rand(0, HOURS - b.len)); el.style.width = pct(b.len * rand(.6, 1.3));
        tracks[r].appendChild(el);
        const t0 = delay + k * 110; k++;
        later(() => { el.style.opacity = 1; }, t0);
        later(() => { el.style.left = pct(b.s); el.style.width = pct(b.len); }, t0 + 350);
        later(() => { el.classList.add("lock", "pop"); }, t0 + 1100 + rand(0, 500));
      });
    });
    return delay + k * 110 + 1700; // 이 판이 끝나는 시각
  }

  function staticGantt(){ // 동작 줄이기: 완성된 모습만
    const plan = layout(), tracks = document.querySelectorAll(".g-track");
    tracks.forEach(t => t.innerHTML = "");
    plan.forEach((blocks, r) => blocks.forEach(function(b, i){
      const el = document.createElement("div");
      el.className = "blk lock"; el.dataset.n = i + 1; el.style.left = pct(b.s); el.style.width = pct(b.len);
      tracks[r].appendChild(el);
    }));
  }

  function setStep(i){
    const txt = $("stepTxt");
    txt.classList.add("out");
    later(function(){
      txt.textContent = STEPS[i] + "…"; $("stepCnt").textContent = "(" + (i + 1) + "/" + STEPS.length + ")";
      txt.classList.remove("out");
    }, reduce ? 0 : 200);
    $("dots").querySelectorAll("i").forEach((d, j) => d.classList.toggle("on", j <= i));
  }

  function finish(){
    clearAll(); // 아직 자리를 찾는 블럭이 있으면 바로 제자리에 채움
    $("gantt").classList.remove("fade");
    document.querySelectorAll(".blk:not(.lock)").forEach(function(el){
      el.style.opacity = 1; el.style.left = pct(+el.dataset.s); el.style.width = pct(+el.dataset.len); el.classList.add("lock", "pop");
    });
    $("dots").querySelectorAll("i").forEach(d => d.classList.add("on"));
    $("status").classList.add("done");
    $("title").textContent = "배차계획을 다 만들었어요";
    $("stepTxt").textContent = "곧 예상 결과를 보여 드릴게요"; $("stepCnt").textContent = "";
    $("hint").style.visibility = "hidden"; $("back").style.visibility = "hidden";
  }

  function start(){
    clearAll();
    reduce = $("reduce").checked;
    $("modal").classList.toggle("reduce", reduce);
    $("status").classList.remove("done");
    $("title").textContent = "AI가 배차계획을 만들고 있어요";
    $("hint").style.visibility = ""; $("back").style.visibility = "";
    $("dots").innerHTML = STEPS.map(() => "<i></i>").join("");
    buildRows();

    STEPS.forEach((_, i) => later(() => setStep(i), i * STEP_MS));
    const total = STEPS.length * STEP_MS;
    later(finish, total);

    if(reduce){ staticGantt(); return; }
    // 단계가 도는 동안 간트 판을 계속 바꿔 가며 반복, 마지막 판은 채운 채로 둠
    (function loop(at){
      const end = playRound(at);
      if(end + 2200 < total){
        later(() => $("gantt").classList.add("fade"), end + 600);
        later(() => loop(0), end + 1000);
      }
    })(0);
  }

  $("replay").addEventListener("click", start);
  $("reduce").addEventListener("change", start);
  $("back").addEventListener("click", function(){
    const t = $("toast"); t.textContent = "배차계획이 끝나면 알려 드릴게요.";
    t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
  });

  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) $("reduce").checked = true;
  start();
})();
</script>
</body>
</html>
