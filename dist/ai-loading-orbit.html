<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 배차계획 대기화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--text:#2E3238;--sub1:#5C6370;--sub2:#767D8A;--sub3:#9197A1;--line:#E4E5E9;--bg:#F5F7FA;--blue:#005FFF;--ai1:#337FFF;--ai2:#9966FF;--font:"Pretendard",-apple-system,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:#5C6068;font-family:var(--font);color:var(--text);letter-spacing:-0.3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;}
  button,select{font-family:var(--font);letter-spacing:inherit;}

  /* 데모 조작 (프로토타입 전용) */
  .demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#fff;font-size:13px;}
  .demo button,.demo select{height:30px;padding:0 10px;border:1px solid rgba(255,255,255,.35);border-radius:4px;background:rgba(255,255,255,.08);color:#fff;font-size:13px;cursor:pointer;}
  .demo select option{color:#2E3238;}
  .demo label{display:flex;align-items:center;gap:6px;cursor:pointer;}

  .modal{position:relative;width:1280px;max-width:100%;height:760px;max-height:calc(100vh - 70px);background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;}
  .modal[hidden]{display:none;}
  .head{display:flex;align-items:center;gap:16px;height:62px;padding:0 24px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .head h1{margin:0;font-size:20px;font-weight:700;}
  .head .day{font-size:16px;color:var(--sub1);}
  .head .day b{margin-left:6px;font-weight:600;color:var(--text);}
  .head .ic{width:32px;height:32px;border:none;border-radius:4px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .head .ic:hover{background:#EEEFF1;}
  .head .ic:first-of-type{margin-left:auto;}

  .body{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr 260px;gap:0 24px;padding:20px 24px;background:var(--bg);}
  canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

  /* 오더·기사 카드 */
  .col{position:relative;z-index:1;display:flex;flex-direction:column;min-height:0;}
  .col-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:14px;font-weight:700;}
  .col-h span{font-size:12px;font-weight:400;color:var(--sub2);}
  .col-h b{color:var(--blue);font-variant-numeric:tabular-nums;}
  .cards{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden;}
  .card{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;
    opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s cubic-bezier(.2,.8,.2,1),background-color .3s,border-color .3s;}
  .card.in{opacity:1;transform:none;}
  .card .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;}
  .card .bd{height:18px;padding:0 5px;border-radius:3px;background:#F1F2F4;font-size:10px;font-weight:600;line-height:18px;color:var(--sub1);}
  .card .s{margin-top:2px;color:var(--sub2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .s i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:#1FA34A;vertical-align:1px;}
  .card .s i.to{background:#7C4DFF;margin-left:2px;}
  .card .cnt{font-size:11px;font-weight:400;color:var(--sub2);}
  .card.emit{border-color:#CCDFFF;background:#F5F9FF;}
  .more{margin-top:6px;text-align:center;font-size:11px;color:var(--sub3);}

  /* 가운데 */
  .mid{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  .msg{text-align:center;}
  .msg h2{margin:4px 0 10px;font-size:20px;font-weight:700;}
  .bar{position:relative;width:200px;height:4px;margin:0 auto;border-radius:2px;background:#E4E5E9;overflow:hidden;}
  .bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:2px;background:linear-gradient(90deg,var(--ai1),var(--ai2));animation:flow 1.4s ease-in-out infinite;}
  @keyframes flow{0%{left:-40%;}100%{left:100%;}}
  .bar.full::after{left:0;width:100%;animation:none;}
  .copy{height:20px;margin:10px 0 0;font-size:13px;color:var(--sub1);transition:opacity .25s;}
  .copy.out{opacity:0;}
  .stage{flex:1;width:100%;}
  .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:12px;color:var(--sub1);font-variant-numeric:tabular-nums;}
  .chip i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--ai1),var(--ai2));position:relative;}
  .chip i::after{content:"AI";position:absolute;inset:0;color:#fff;font-size:7px;font-style:normal;font-weight:800;line-height:14px;text-align:center;}
  .foot{margin-top:14px;font-size:12px;color:var(--sub3);pointer-events:auto;}
  .foot button{border:none;background:none;padding:0;font-size:12px;color:var(--sub1);text-decoration:underline;text-underline-offset:3px;cursor:pointer;}

  /* 완료 체크 */
  .check{position:absolute;left:50%;width:72px;height:72px;margin-left:-36px;border-radius:50%;background:linear-gradient(135deg,var(--ai1),var(--ai2));box-shadow:0 0 0 18px rgba(153,102,255,.08),0 0 60px 30px rgba(153,102,255,.18);
    display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.5,.5,1);}
  .check.show{transform:scale(1);}

  /* 결과 화면 전환 (데모) */
  .result{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.96);font-size:16px;}
  .result.show{display:flex;}
  .result button{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:14px;cursor:pointer;}

  /* 최소화 시 */
  .mini{position:fixed;right:24px;bottom:24px;display:none;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;background:#2E3238;color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-variant-numeric:tabular-nums;}
  .mini.show{display:flex;}
  .mini button{height:30px;padding:0 12px;border:none;border-radius:4px;background:#fff;color:#2E3238;font-size:13px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="demo" aria-label="데모 조작">
  <span>프로토타입 조작:</span>
  엔진 응답 <select id="dur"><option value="1500">1.5초 (최소 2.4초 확인)</option><option value="9000" selected>9초</option><option value="40000">40초</option></select>
  <button id="replay">처음부터 다시</button>
  <button id="respond">지금 응답 받기</button>
  <label><input type="checkbox" id="reduce">움직임 줄이기</label>
</div>

<div class="modal" id="modal" role="dialog" aria-label="AI 배차계획 생성 중">
  <div class="head">
    <h1>AI 배차계획</h1>
    <span class="day">배차일지<b>10.11 (내일)</b></span>
    <button class="ic" id="minBtn" title="최소화 — 배차일지에서 계속 진행돼요" aria-label="최소화"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="12" rx="2" stroke="#767D8A" stroke-width="1.4"/><path d="M6.5 12.5h7" stroke="#767D8A" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <button class="ic" aria-label="닫기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#767D8A" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="body" id="body">
    <canvas id="cv"></canvas>
    <div class="col"><div class="col-h">오더<span>선택 <b id="oCnt">0</b>건</span></div><div class="cards" id="oCards"></div><div class="more">외 96건</div></div>
    <div class="mid">
      <div class="msg" role="status" aria-live="polite">
        <h2 id="title">AI 배차계획 생성 중</h2>
        <div class="bar" id="bar"></div>
        <p class="copy" id="copy"></p>
      </div>
      <div class="stage" id="stage"><div class="check" id="check"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M6 12.5l4 4 8-9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <span class="chip"><i></i><span id="clock">계산 중 · 00:00</span></span>
      <p class="foot" id="foot">보통 30초 정도 걸려요 · <button id="backBtn">기다리지 않고 배차일지로 돌아가기</button></p>
    </div>
    <div class="col"><div class="col-h">기사<span>선택 <b id="dCnt">0</b>명</span></div><div class="cards" id="dCards"></div><div class="more">외 42명</div></div>
    <div class="result" id="result"><b>→ AI 배차계획 예상 결과 화면으로 전환</b><span style="font-size:13px;color:var(--sub2)">프로토타입에서는 여기서 멈춰요</span><button id="again">다시 보기</button></div>
  </div>
</div>
<div class="mini" id="mini"><span id="miniTxt">AI 배차계획 생성 중 · 00:00</span><button id="openBtn">열기</button></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const ORDERS = 106, DRIVERS = 52;
  const HUBS = ["이천센터","분당HUB","평택HUB","용인HUB","천안HUB","부산HUB","대구HUB","광주HUB","대전HUB","청주HUB"];
  const NAMES = ["김카모","이진아","박상철","최동욱","정재훈","강성민","조현우","윤태식","임병준","한석규"];
  const COPY = ["선택한 오더와 기사 정보를 확인하고 있어요.","기사별 차고지와 운영시간을 살펴보고 있어요.","이동 경로와 거리를 계산하고 있어요.","가장 많이 배차되는 조합을 찾고 있어요."];
  const MIN_SHOW = 2400;

  // 카드 마크업
  $("oCards").innerHTML = Array.from({length:10}, function(_, i){
    return '<div class="card"><div class="t">KMO' + (1201 + i) + '<span class="bd">배차대기</span></div><div class="s"><i></i>' + HUBS[i] + ' ' + String(7 + i).padStart(2,"0") + ':00 → <i class="to"></i>' + HUBS[(i + 5) % 10] + ' · ' + ["5톤 카고","11톤 윙바디","2.5톤 카고"][i % 3] + '</div></div>';
  }).join("");
  $("dCards").innerHTML = NAMES.map(function(n, i){
    return '<div class="card"><div class="t">' + n + '<span class="cnt">계획 0 · 완료 0</span></div><div class="s">서울8' + i + '바' + (4922 + i * 113) + ' · ' + ["5.5톤 카고","11톤 윙바디","2.5톤 카고"][i % 3] + ' · 차고지 ' + ["이천","평택","분당","용인"][i % 4] + '</div></div>';
  }).join("");
  const oCards = Array.from(document.querySelectorAll("#oCards .card")), dCards = Array.from(document.querySelectorAll("#dCards .card"));

  // ── 캔버스 ──
  const cv = $("cv"), ctx = cv.getContext("2d"), body = $("body");
  let W = 0, H = 0, dpr = 1, center = {x:0, y:0}, R = 100;
  function resize(){
    const r = body.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const st = $("stage").getBoundingClientRect();
    center = {x: st.left - r.left + st.width / 2, y: st.top - r.top + st.height / 2};
    R = Math.max(60, Math.min(130, st.height * .36, st.width * .3));
    $("check").style.top = (st.height / 2 - 36) + "px";
  }
  const rel = el => { const a = el.getBoundingClientRect(), b = body.getBoundingClientRect(); return {l:a.left - b.left, r:a.right - b.left, y:a.top - b.top + a.height / 2}; };

  // 구: 피보나치 점 + 가까운 점끼리 선
  let pts = [], edges = [];
  function buildSphere(n){
    pts = []; edges = [];
    for(let i = 0; i < n; i++){
      const y = 1 - (i + .5) * 2 / n, rr = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
      pts.push([Math.cos(th) * rr, y, Math.sin(th) * rr]);
    }
    const lim = 3.8 / Math.sqrt(n);
    for(let i = 0; i < n; i++) for(let j = i + 1; j < n; j++){
      const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1], pts[i][2] - pts[j][2]);
      if(d < lim) edges.push([i, j]);
    }
  }

  let st = {}, raf = 0, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  let tilt = {x:0, y:0}, tiltT = {x:0, y:0};
  body.addEventListener("mousemove", function(e){
    const b = body.getBoundingClientRect();
    tiltT = {x:((e.clientY - b.top) / b.height - .5) * .5, y:((e.clientX - b.left) / b.width - .5) * .5};
  });

  function project(p, rot){
    let [x, y, z] = p;
    const cy = Math.cos(rot + tilt.y), sy = Math.sin(rot + tilt.y);
    [x, z] = [x * cy + z * sy, -x * sy + z * cy];
    const cx = Math.cos(.35 + tilt.x), sx = Math.sin(.35 + tilt.x);
    [y, z] = [y * cx - z * sx, y * sx + z * cx];
    return {x:center.x + x * R * st.scale, y:center.y + y * R * st.scale, z:z};
  }

  // 입자: 오더 카드 → 구 (+30%는 구 → 기사 쪽으로 옅게 퍼짐, 카드는 강조하지 않음)
  function spawn(fromCard){
    const c = fromCard || oCards[Math.floor(Math.random() * oCards.length)];
    if(!c.classList.contains("in")) return;
    const s = rel(c), a = Math.random() * Math.PI - Math.PI / 2;
    st.parts.push({x0:s.r, y0:s.y, x1:center.x - Math.cos(a) * R * .95, y1:center.y + Math.sin(a) * R * .95, t:0, dur:st.converge ? 600 : 900 + Math.random() * 500, kind:"in"});
    c.classList.add("emit"); clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove("emit"), 900);
    if(!st.converge && Math.random() < .3){
      const b = Math.random() * 1.2 - .6, len = 120 + Math.random() * 120;
      st.parts.push({x0:center.x + Math.cos(b) * R, y0:center.y + Math.sin(b) * R, x1:center.x + Math.cos(b) * (R + len), y1:center.y + Math.sin(b) * (R + len), t:-300, dur:900, kind:"out"});
    }
  }

  function drawParts(dt){
    st.parts = st.parts.filter(p => p.t < p.dur + 400);
    st.parts.forEach(function(p){
      p.t += dt; if(p.t < 0) return;
      const k = Math.min(1, p.t / p.dur), e = 1 - Math.pow(1 - k, 3);
      const fade = p.t > p.dur ? 1 - (p.t - p.dur) / 400 : 1;
      const mx = (p.x0 + p.x1) / 2, my = p.kind === "in" ? (p.y0 + p.y1) / 2 - 30 : (p.y0 + p.y1) / 2;
      const q = t => ({x:(1-t)*(1-t)*p.x0 + 2*(1-t)*t*mx + t*t*p.x1, y:(1-t)*(1-t)*p.y0 + 2*(1-t)*t*my + t*t*p.y1});
      const tail = Math.max(0, e - .35), head = q(e);
      ctx.beginPath();
      for(let s = tail; s <= e; s += .03){ const pt = q(s); s === tail ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y); }
      ctx.lineTo(head.x, head.y);
      const g = ctx.createLinearGradient(q(tail).x, q(tail).y, head.x, head.y);
      const al = (p.kind === "out" ? .25 : .55) * fade;
      g.addColorStop(0, "rgba(51,127,255,0)"); g.addColorStop(1, "rgba(51,127,255," + al + ")");
      ctx.strokeStyle = g; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.beginPath(); ctx.arc(head.x, head.y, 2, 0, 7); ctx.fillStyle = "rgba(0,95,255," + al * 1.4 + ")"; ctx.fill();
    });
  }

  function draw(now){
    const dt = Math.min(50, now - (st.last || now)); st.last = now;
    ctx.clearRect(0, 0, W, H);
    tilt.x += (tiltT.x - tilt.x) * .05; tilt.y += (tiltT.y - tilt.y) * .05;
    if(!st.reduce) st.rot += dt * .00025;
    st.assemble = Math.min(1, st.assemble + dt / 900);
    if(st.shrink) st.scale = Math.max(0, st.scale - dt / 450);

    if(st.scale > 0){
      // 뒤쪽 빛
      const glow = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, R * 1.9 * st.scale);
      glow.addColorStop(0, "rgba(153,102,255,.16)"); glow.addColorStop(1, "rgba(153,102,255,0)");
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(center.x, center.y, R * 1.9 * st.scale, 0, 7); ctx.fill();
      // 조립: 점이 바깥에서 모임
      const asm = 1 - Math.pow(1 - st.assemble, 3);
      const P = pts.map(function(p, i){ const pp = project(p, st.rot); const sc = 1 + (1 - asm) * (1.2 + (i % 7) * .2); return {x:center.x + (pp.x - center.x) * sc, y:center.y + (pp.y - center.y) * sc, z:pp.z}; });
      ctx.lineWidth = .7;
      edges.forEach(function(e){
        const a = P[e[0]], b = P[e[1]], z = (a.z + b.z) / 2;
        ctx.strokeStyle = "rgba(124,77,255," + ((z + 1.3) * .24 * asm) + ")";
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      });
      P.forEach(function(p, i){
        const hi = st.hi.indexOf(i) !== -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, hi ? 3.2 : 1.6 + (p.z + 1) * .5, 0, 7);
        ctx.fillStyle = hi ? "rgba(119,51,255," + asm + ")" : "rgba(51,127,255," + ((p.z + 1.3) * .35 * asm) + ")"; ctx.fill();
      });
    }
    drawParts(dt);
    raf = requestAnimationFrame(draw);
  }

  function setCopy(text){
    const c = $("copy"); c.classList.add("out");
    later(function(){ c.textContent = text; c.classList.remove("out"); }, 250);
  }
  const fmt = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  function tickClock(){
    const el = fmt(performance.now() - st.t0);
    $("clock").textContent = (st.done ? "계산 완료 · " : "계산 중 · ") + el;
    $("miniTxt").textContent = (st.done ? "AI 배차계획 완료 · " : "AI 배차계획 생성 중 · ") + el;
  }
  function countUp(el, to, ms){
    const t0 = performance.now();
    (function f(){ const k = Math.min(1, (performance.now() - t0) / ms); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if(k < 1) st.cu = requestAnimationFrame(f); })();
  }

  // 응답 수신 → 선이 구로 모임 → 구가 체크로 → 결과 화면
  function respond(){
    if(st.done || st.waitingMin) return;
    const wait = MIN_SHOW - (performance.now() - st.t0);
    if(wait > 0){ st.waitingMin = true; later(() => { st.waitingMin = false; respond(); }, wait); return; }
    st.done = true; st.converge = true;
    timers.forEach(clearTimeout); timers = [];
    clearInterval(st.spawnT); clearInterval(st.hiT); clearInterval(st.copyT);
    tickClock(); clearInterval(st.clockT);
    $("bar").classList.add("full"); $("foot").style.visibility = "hidden";
    $("title").textContent = "AI 배차계획 생성 완료";
    setCopy("배차 결과를 불러오고 있어요.");
    oCards.forEach((c, i) => later(() => spawn(c), i * 30));
    later(() => { st.shrink = true; }, 500);
    later(() => $("check").classList.add("show"), 800);
    later(() => $("result").classList.add("show"), 1400);
  }

  function start(){
    cancelAnimationFrame(raf); cancelAnimationFrame(st.cu);
    timers.forEach(clearTimeout); timers = [];
    ["spawnT","hiT","copyT","clockT"].forEach(k => clearInterval(st[k]));
    const reduce = $("reduce").checked;
    st = {t0:performance.now(), rot:0, scale:1, assemble:reduce ? 1 : 0, parts:[], hi:[], reduce:reduce, done:false, converge:false, shrink:false};
    buildSphere(reduce ? 40 : 110);
    $("check").classList.remove("show"); $("result").classList.remove("show"); $("bar").classList.remove("full");
    $("foot").style.visibility = ""; $("title").textContent = "AI 배차계획 생성 중";
    $("copy").textContent = COPY[0];
    [...oCards, ...dCards].forEach(c => c.classList.remove("in", "emit"));
    resize();

    // 등장: 오더 0.09초, 기사 0.1초 간격
    oCards.forEach((c, i) => later(() => c.classList.add("in"), i * 90));
    dCards.forEach((c, i) => later(() => c.classList.add("in"), 100 + i * 100));
    countUp($("oCnt"), ORDERS, 1400); countUp($("dCnt"), DRIVERS, 1400);

    // 계산 중 (1.6초부터)
    later(function(){
      st.spawnT = setInterval(() => spawn(), reduce ? 700 : 110);
    }, 1600);
    st.hiT = setInterval(() => { st.hi = Array.from({length:5}, () => Math.floor(Math.random() * pts.length)); }, 260);
    let ci = 0; st.copyT = setInterval(() => setCopy(COPY[++ci % COPY.length]), 3500);
    st.clockT = setInterval(tickClock, 250); tickClock();

    later(respond, Number($("dur").value));
    raf = requestAnimationFrame(draw);
  }

  // 최소화·탭 가림: 그리기 멈춤 (계산과 시간은 계속)
  function minimize(on){
    $("modal").hidden = on; $("mini").classList.toggle("show", on);
    if(on) cancelAnimationFrame(raf); else { st.last = 0; resize(); raf = requestAnimationFrame(draw); }
  }
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) cancelAnimationFrame(raf); else if(!$("modal").hidden){ st.last = 0; raf = requestAnimationFrame(draw); }
  });

  $("minBtn").addEventListener("click", () => minimize(true));
  $("backBtn").addEventListener("click", () => minimize(true));
  $("openBtn").addEventListener("click", () => minimize(false));
  $("replay").addEventListener("click", start);
  $("again").addEventListener("click", start);
  $("respond").addEventListener("click", respond);
  $("reduce").addEventListener("change", start);
  $("dur").addEventListener("change", start);
  window.addEventListener("resize", resize);
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) $("reduce").checked = true;
  start();
})();
</script>
</body>
